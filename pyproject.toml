[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-transpiler"
version = "0.1.0"
description = "Poly — a semantic cross-language transpiler with a validated LLM fallback"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=0.39"]   # only needed for the live LLM path; offline mode needs nothing

[project.scripts]
poly = "poly.cli:main"

[tool.setuptools]
packages = ["poly", "poly.codegen", "poly.llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
