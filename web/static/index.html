<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poly Transpiler</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,500;0,600;0,800;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="veil"></div>

<section class="tile" id="tile" role="application" aria-label="Poly transpiler terminal">
  <div class="tile-head" id="tilehead">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <button class="mini-ic" id="vizbtn" type="button" title="Visualize the 6 compiler stages on this code">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="2" y="1.5" width="12" height="3" rx="1.5"/>
        <rect x="2" y="6.5" width="12" height="3" rx="1.5"/>
        <rect x="2" y="11.5" width="12" height="3" rx="1.5"/>
      </svg>
    </button>

    <div class="dd" id="dd-source">
      <button class="dd-trigger" type="button" aria-haspopup="listbox">
        <span class="dd-label">source</span>
        <span class="dd-value">Python</span>
        <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <ul class="dd-menu" role="listbox">
        <li role="option" data-value="python" class="on">Python</li>
      </ul>
    </div>

    <button class="flow swap" id="swap" type="button" title="Swap input and output languages" aria-label="Swap languages">&#8644;</button>

    <div class="dd" id="dd-target">
      <button class="dd-trigger" type="button" aria-haspopup="listbox">
        <span class="dd-label">target</span>
        <span class="dd-value">JavaScript</span>
        <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <ul class="dd-menu" role="listbox">
        <li role="option" data-value="js" class="on">JavaScript</li>
        <li role="option" data-value="py">Python</li>
        <li role="option" data-value="c">C</li>
      </ul>
    </div>

    <button class="btn primary" id="run" type="button" title="Transpile (Ctrl+Enter)">Run</button>
    <button class="btn ghost" id="check" type="button" title="Execute source and translation locally, then compare stdout">Check</button>
    <button class="mini" id="example" type="button" title="Load an example in the source language">example</button>

    <span class="spacer"></span>

    <label class="key" title="Optional Anthropic API key. Leave empty to use your Claude CLI login. Never stored.">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4a5.5 5.5 0 1 0 5.37 6.7L21 12l-1.5 1.5L18 12l-1.5 1.5L15 12l-1.13 1.13A5.5 5.5 0 1 0 14.5 4Zm-2 4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" transform="rotate(135 12 12)"/></svg>
      <input id="apikey" type="password" placeholder="API key (optional)" aria-label="Optional Anthropic API key" autocomplete="off" spellcheck="false">
    </label>
    <button class="btn ghost" id="settingsbtn" type="button" aria-expanded="false">Settings</button>
  </div>

  <div class="settings" id="settings" hidden>
    <label>Translation service <select id="provider"><option value="auto">Auto (API key or Claude login)</option><option value="claude">Claude CLI login</option><option value="anthropic">Anthropic API</option></select></label>
    <label>Model (optional) <input id="model" placeholder="Default model" spellcheck="false"></label>
    <span id="service-info">Checking available translation services…</span>
    <span>Run translates code. Check executes both programs locally and compares their output. Use trusted code only.</span>
  </div>

  <div class="panes" id="panes">
    <div class="pane" id="pane-src">
      <div class="pane-bar"><span class="pane-label" id="label-src">source &middot; python</span></div>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
    </div>
    <div class="divider" id="divider" title="Drag to resize panes"></div>
    <div class="pane" id="pane-out">
      <div class="pane-bar">
        <span class="pane-label" id="label-out">output &middot; javascript</span>
        <button class="mini" id="copy" type="button">copy</button>
        <button class="mini" id="download" type="button">download</button>
      </div>
      <pre id="out"><code class="placeholder">output appears here</code></pre>
    </div>
  </div>

  <div class="statusbar">
    <span id="status">ready</span>
    <span id="timing"></span>
  </div>

  <div class="grip" id="grip" title="Drag to resize" aria-hidden="true"></div>
</section>

<section class="tile viz" id="viz" hidden aria-label="Compiler pipeline visualization">
  <div class="tile-head viz-head">
    <span class="viz-title">translation pipeline</span>
    <span class="spacer"></span>
    <button class="mini-ic" id="vizrefresh" type="button" title="Re-run on current code">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M13.8 1.8v3h-3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="mini-ic" id="vizclose" type="button" title="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="viz-body" id="vizbody"></div>
</section>

<script src="app.js"></script>
</body>
</html>
